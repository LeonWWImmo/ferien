  <title>Privat</title>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      margin: 0;
      background: #13111c radial-gradient(120% 55% at 90% -10%, rgba(242, 167, 181, .2), transparent 60%) no-repeat;
      color: #f7efe6;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    form { width: min(320px, 100% - 40px); text-align: center; }
    .lock { font-size: 44px; }
    h1 { margin: 8px 0 4px; font: italic 300 42px Georgia, serif; }
    p { margin: 0 0 22px; color: #a89fb0; }
    input {
      box-sizing: border-box;
      width: 100%;
      height: 58px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, .06);
      color: inherit;
      font-size: 26px;
      letter-spacing: .4em;
      text-align: center;
    }
    input:focus { border-color: #f2a7b5; }
    button {
      width: 100%;
      height: 52px;
      margin-top: 12px;
      border: 0;
      border-radius: 16px;
      background: #f2a7b5;
      color: #2a1420;
      font-size: 16px;
      font-weight: 700;
    }
    #msg { min-height: 24px; margin: 16px 0 0; }
    .shake { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  </style>

    const STORE = "ferien-pw";
    const f = document.getElementById("f");
    const pw = document.getElementById("pw");
    const msg = document.getElementById("msg");
    const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    // Wirft bei falschem Passwort (AES-GCM prüft die Integrität)
    async function unlock(password) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const dec = (iv, data) => crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(iv) }, key, data);
      const page = JSON.parse(new TextDecoder().decode(await dec(P.iv, bytes(P.data))));
      return { page, dec };
    }

    // Bilder werden erst entschlüsselt, wenn die Seite sie braucht (window.__img)
    async function show({ page, dec }) {
      const cache = {};
      window.__img = (path) => cache[path] || (cache[path] = (async () => {
        const img = page.images[path];
        if (!img) return path;
        const buf = await (await fetch(img.f)).arrayBuffer();
        return URL.createObjectURL(new Blob([await dec(img.iv, buf)], { type: "image/jpeg" }));
      })());
      document.open();
      document.write(page.html);
      document.close();
    }

    async function enter(password, remember) {
      msg.textContent = "Entsperre …";
      let res;
      try {
        res = await unlock(password);
      } catch (e) {
        try { localStorage.removeItem(STORE); } catch (e) {}
        msg.textContent = remember ? "Falsches Passwort" : "";
        if (remember) { f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); pw.select(); }
        return;
      }
      try { localStorage.setItem(STORE, password); } catch (e) {}
      try {
        await show(res);
      } catch (e) {
        msg.textContent = "Laden fehlgeschlagen – Internet prüfen und neu laden.";
      }
    }

    f.addEventListener("submit", (e) => {
      e.preventDefault();
      enter(pw.value, true);
    });

    let saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (saved) enter(saved, false);
  </script>
